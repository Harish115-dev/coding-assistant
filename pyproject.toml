[project]
name = "coding-assistant"
version = "0.1.0"
description = "A hybrid online/offline AI coding assistant — CLI-first, VS Code extension planned."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "groq>=0.11.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
assistant = "assistant.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
